# Tempo single-binary, filesystem storage. OTLP-only ingestion (gRPC + HTTP).
# Step-1 minimal config. The metrics-generator (service-graphs, span-metrics)
# is added in step 4 when prometheus is configured with remote_write enabled.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
