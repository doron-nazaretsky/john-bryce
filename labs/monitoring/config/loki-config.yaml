# Loki single-binary, filesystem storage. Teaching-lab footprint — no rings,
# no replication, ~zero cost at idle. Schema v13 (TSDB) is the current default.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: ""

# Lenient ingestion limits for a single-binary teaching lab.
limits_config:
  retention_period: 24h
  allow_structured_metadata: true
  volume_enabled: true
