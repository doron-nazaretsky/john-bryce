# Streaming lab: 3-broker Kafka cluster (KRaft) + dedicated `spark` sidecar
# running Jupyter with Spark in local[*] mode. Merges with labs/base/compose.yml.
#
# Why split workspace and Spark:
#   The base workspace container hosts the MyST docs server (Node) and, in older
#   versions of this lab, also hosted the Spark driver + Jupyter kernel in the
#   same process tree. That meant MyST's Node process and Spark's JVM competed
#   for the same 3 GB mem_limit, and a heavy Spark query could starve docs or
#   vice versa. We now isolate them: workspace = MyST only, spark = Jupyter +
#   pyspark. Memory budgets are explicit and either side can crash without
#   taking the other down. The student-facing UX is unchanged because MyST runs
#   in the browser and connects to http://localhost:8888 (the spark container's
#   published port) exactly as before.
#
# Architecture:
#   workspace            MyST docs server (3000). Repo mounted at /workspace.
#                        No Jupyter, no JVM.
#   spark                Jupyter server (8888) + Spark driver/executor (local[*]).
#                        Same base image with LAB=streaming so pyspark +
#                        kafka-python are installed. Spark UI on 4040 while a
#                        query is running. Repo mounted at /workspace so the
#                        kernel sees the same files as the workspace's MyST.
#   kafka-1/2/3          3-node KRaft cluster (combined broker+controller).
#   kafka-ui             Kafka cluster inspector (host port 18080).
#
# Sizing (8 GB laptop):
#   workspace:           ~700m  (MyST/Node only — no JVM)
#   spark:               ~2700m (Spark JVM heap + driver + kernel)
#   kafka-1/2/3:         320m each (~960m)
#   kafka-ui:            400m
#   total guaranteed:    ~4.8g
#
# Usage: make lab-streaming

services:
  workspace:
    build:
      args:
        LAB: streaming
    # Override (not append) the inherited port list — Jupyter has moved to the
    # `spark` sidecar, which now owns host port 8888. Compose's `!override` tag
    # replaces the entire list from labs/base/compose.yml.
    ports: !override
      - "3000:3000"
      - "3100:3100"
    # Run MyST only. Jupyter is no longer started here.
    command: ["bash", "labs/streaming/workspace-init.sh"]
    mem_limit: 700m
    depends_on:
      spark:
        condition: service_healthy

  spark:
    container_name: spark
    hostname: spark
    build:
      context: ../..
      dockerfile: labs/base/Dockerfile
      args:
        LAB: streaming
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-local-dev}
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    command: ["bash", "labs/streaming/spark-init.sh"]
    ports:
      - "8888:8888"
      - "4040:4040"
    mem_limit: 2700m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/api/status -H 'Authorization: token local-dev' >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped

  kafka-1:
    image: bitnamilegacy/kafka:3.7.0
    container_name: kafka-1
    hostname: kafka-1
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_KRAFT_CLUSTER_ID=streaming-lab-cluster
      # Cap JVM heap so it cannot grow past the 320m cgroup limit during
      # startup (when index loading + metadata replay drives a large allocation
      # spike before GC catches up). Without this the JVM uses Bitnami's
      # default -Xmx1024m and the container is OOM-killed by the kernel.
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx256m
    ports:
      - "19092:19092"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-2:
    image: bitnamilegacy/kafka:3.7.0
    container_name: kafka-2
    hostname: kafka-2
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:19093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_KRAFT_CLUSTER_ID=streaming-lab-cluster
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx256m
    ports:
      - "19093:19093"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-3:
    image: bitnamilegacy/kafka:3.7.0
    container_name: kafka-3
    hostname: kafka-3
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:19094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_KRAFT_CLUSTER_ID=streaming-lab-cluster
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx256m
    ports:
      - "19094:19094"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Web UI for inspecting the Kafka cluster (topics, partitions, messages,
  # consumer groups, lag). Think pgAdmin for Kafka. Kafbat is the actively
  # maintained fork of provectuslabs/kafka-ui — same image API, same env vars.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=streaming-lab
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - DYNAMIC_CONFIG_ENABLED=true
    ports:
      - "18080:8080"
    mem_limit: 400m
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped
