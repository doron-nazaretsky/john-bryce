# Spark hands-on lab: 6 containers (master, 2 workers, jupyter driver, postgres, mongo).
#
# Standalone — does NOT merge labs/base/compose.yml. The Spark lesson is a deliberate
# departure from the MyST teaching model; students work directly in spark-jupyter.
#
# Architecture: Spark Standalone cluster (spark://spark-master:7077). Driver lives in
# spark-jupyter (its own image with JupyterLab + JDBC/Mongo connector JARs baked in).
# Workers and driver share the same Bitnami Spark 3.5.1 base for classpath parity.
#
# Sizing: tuned for an 8 GB Windows laptop. Total guaranteed ~4.5 GB.
#
# Usage: make lab-spark   (run `make data-spark` once beforehand to download TLC data)

services:
  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "8080:8080"   # Master web UI
      - "7077:7077"   # Master RPC
    cpuset: "0"
    mem_limit: 512m
    healthcheck:
      # bitnami/spark image ships without curl/wget. Master RPC (7077) binds to the
      # container's external hostname only, so we probe the Master UI (8080) which
      # is wildcard-bound on 0.0.0.0.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  spark-worker-1:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=900m
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    volumes:
      # Read parquet via file:/ URIs the driver constructs. Named volume (not bind
      # mount) because bind mounts are slow on Windows Docker Desktop (WSL2 9P) —
      # students on Win/Mac would see GB-scale parquet reads degrade materially.
      # Populated once from ./data by init.sh, then stays on the Docker VM disk.
      - spark_data:/home/jovyan/work/data:ro
    cpuset: "1"
    mem_limit: 1g
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  spark-worker-2:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=900m
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    volumes:
      - spark_data:/home/jovyan/work/data:ro
    cpuset: "2"
    mem_limit: 1g
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  spark-jupyter:
    build:
      context: ../spark
      dockerfile: Dockerfile.jupyter
    container_name: spark-jupyter
    hostname: spark-jupyter
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PG_URL=jdbc:postgresql://spark-postgres:5432/taxi
      - PG_USER=spark
      - PG_PASSWORD=spark
      - MONGO_URI=mongodb://spark-mongo:27017
    working_dir: /home/jovyan/work
    volumes:
      # Notebooks + jobs + helpers are tiny, bind-mounted so edits persist to the repo.
      - ./notebooks:/home/jovyan/work/notebooks
      - ./jobs:/home/jovyan/work/jobs
      - ./helpers:/home/jovyan/work/helpers
      # Data via named volume (see worker comment). RW so init.sh can populate it.
      - spark_data:/home/jovyan/work/data
    # Disable token + password for classroom convenience (local-only lab).
    command: ["start-notebook.sh", "--ServerApp.token=", "--ServerApp.password=", "--ServerApp.allow_origin=*"]
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark driver UI
    cpuset: "3"
    mem_limit: 1500m
    depends_on:
      spark-master:
        condition: service_healthy
      spark-postgres:
        condition: service_healthy
      spark-mongo:
        condition: service_healthy
    restart: unless-stopped

  spark-postgres:
    image: postgres:16-alpine
    container_name: spark-postgres
    hostname: spark-postgres
    environment:
      - POSTGRES_USER=spark
      - POSTGRES_PASSWORD=spark
      - POSTGRES_DB=taxi
    ports:
      - "5432:5432"
    volumes:
      - spark_pg_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d taxi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  spark-mongo:
    image: mongo:7
    container_name: spark-mongo
    hostname: spark-mongo
    ports:
      - "27017:27017"
    volumes:
      - spark_mongo_data:/data/db
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  spark_pg_data:
  spark_mongo_data:
  spark_data:
