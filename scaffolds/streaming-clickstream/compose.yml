# Streaming-clickstream scaffold: 3-broker Kafka (KRaft) + Jupyter driver running
# Spark in local[*] mode. Standalone (does NOT merge labs/base/compose.yml).
#
# We deliberately do NOT spin up a Spark master + workers. The teaching value
# of this project is Kafka + Structured Streaming concepts (offsets, checkpoints,
# watermarks, late data); the same DataFrame/Streaming APIs run in local mode.
# Dropping the Spark cluster keeps tests fast and reliable (no Ivy package
# distribution to executors, no shared-volume gymnastics) and frees memory for
# the driver.
#
# Container names and host ports are prefixed/shifted so this project can run in
# parallel with the main `labs/streaming/` lab (which uses the unprefixed names
# and the default ports).
#
# Sizing for an 8 GB laptop: ~4.3 GB guaranteed total (3 × 512m Kafka + 2.8 GB Jupyter).

services:
  project-kafka-1:
    image: bitnamilegacy/kafka:3.7.0
    container_name: project-kafka-1
    hostname: project-kafka-1
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@project-kafka-1:9093,2@project-kafka-2:9093,3@project-kafka-3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://project-kafka-1:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_KRAFT_CLUSTER_ID=streaming-clickstream-cluster
      # Trim default thread pools — production defaults are way oversized for a
      # 3-broker dev cluster handling ~50 evt/sec.
      - KAFKA_CFG_NUM_NETWORK_THREADS=2
      - KAFKA_CFG_NUM_IO_THREADS=2
      - KAFKA_CFG_BACKGROUND_THREADS=4
      - KAFKA_CFG_NUM_REPLICA_FETCHERS=1
    ports:
      - "29092:19092"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  project-kafka-2:
    image: bitnamilegacy/kafka:3.7.0
    container_name: project-kafka-2
    hostname: project-kafka-2
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@project-kafka-1:9093,2@project-kafka-2:9093,3@project-kafka-3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://project-kafka-2:9092,EXTERNAL://localhost:29093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_KRAFT_CLUSTER_ID=streaming-clickstream-cluster
      # Trim default thread pools — production defaults are way oversized for a
      # 3-broker dev cluster handling ~50 evt/sec.
      - KAFKA_CFG_NUM_NETWORK_THREADS=2
      - KAFKA_CFG_NUM_IO_THREADS=2
      - KAFKA_CFG_BACKGROUND_THREADS=4
      - KAFKA_CFG_NUM_REPLICA_FETCHERS=1
    ports:
      - "29093:19093"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  project-kafka-3:
    image: bitnamilegacy/kafka:3.7.0
    container_name: project-kafka-3
    hostname: project-kafka-3
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@project-kafka-1:9093,2@project-kafka-2:9093,3@project-kafka-3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://project-kafka-3:9092,EXTERNAL://localhost:29094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_NUM_PARTITIONS=6
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_KRAFT_CLUSTER_ID=streaming-clickstream-cluster
      # Trim default thread pools — production defaults are way oversized for a
      # 3-broker dev cluster handling ~50 evt/sec.
      - KAFKA_CFG_NUM_NETWORK_THREADS=2
      - KAFKA_CFG_NUM_IO_THREADS=2
      - KAFKA_CFG_BACKGROUND_THREADS=4
      - KAFKA_CFG_NUM_REPLICA_FETCHERS=1
    ports:
      - "29094:19094"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  project-streaming-jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: project-streaming-jupyter
    hostname: project-streaming-jupyter
    user: root
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=project-kafka-1:9092,project-kafka-2:9092,project-kafka-3:9092
      - PAGEVIEWS_TOPIC=pageviews
      - DATA_DIR=/home/jovyan/work/data
      - CHECKPOINT_DIR=/home/jovyan/work/checkpoints
      - CHOWN_EXTRA=/home/jovyan/work/data,/home/jovyan/work/checkpoints
      - CHOWN_EXTRA_OPTS=-R
    working_dir: /home/jovyan/work
    volumes:
      - ./pipeline:/home/jovyan/work/pipeline
      - ./jobs:/home/jovyan/work/jobs
      - ./scripts:/home/jovyan/work/scripts
      - ./helpers:/home/jovyan/work/helpers
      - ./tests:/home/jovyan/work/tests
      - ./notebooks:/home/jovyan/work/notebooks
      - streaming_data:/home/jovyan/work/data
      - streaming_checkpoints:/home/jovyan/work/checkpoints
    command: ["start-notebook.sh", "--ServerApp.token=devtoken", "--ServerApp.password=", "--ServerApp.allow_origin=*", "--ServerApp.allow_remote_access=True"]
    ports:
      - "18888:8888"
      - "14040:4040"
    mem_limit: 2800m
    depends_on:
      project-kafka-1:
        condition: service_healthy
      project-kafka-2:
        condition: service_healthy
      project-kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  streaming_data:
  streaming_checkpoints:
